services:
  mcp:
    # Clone the upstream repo alongside this repository as ./ha-device-mcp.
    build:
      context: ./ha-device-mcp
    env_file:
      - .env
    ports:
      # Keep private to the Pi; the tunnel connects over loopback.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
