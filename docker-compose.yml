services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    restart: unless-stopped
    depends_on:
      - ha-mcp
      - citibike-mcp
      - flaim
    networks:
      - homelab

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ${HA_CONFIG_DIR:-./config/homeassistant}:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  ha-mcp:
    build:
      context: ../ha-device-mcp
    env_file: .env
    environment:
      HA_URL: ${HA_URL:-http://host.docker.internal:8123}
      HA_LONG_LIVED_ACCESS_TOKEN: ${HA_LONG_LIVED_ACCESS_TOKEN:?Set HA_LONG_LIVED_ACCESS_TOKEN in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - homelab

  citibike-mcp:
    build:
      context: ../citibike-lookup
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8002"
      MCP_AUTH_TOKEN: ${CITIBIKE_MCP_TOKEN:-${MCP_AUTH_TOKEN:?Set CITIBIKE_MCP_TOKEN or MCP_AUTH_TOKEN in .env}}
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - homelab

  flaim:
    build:
      context: ../flaim
    env_file: .env
    environment:
      FLAIM_MCP_HOST: 0.0.0.0
      FLAIM_MCP_PORT: "8790"
    ports:
      - "8790:8790"
    restart: unless-stopped
    networks:
      - homelab

networks:
  homelab:
    name: pi-homelab
